<!DOCTYPE html>
<html>
<header>

    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders:opsz,wght@10..72,100..900&display=swap"
        rel="stylesheet">

</header>

<body>
    <div id="intro-visual">
        <!-- here i want to add the caresoul(?) and the logo ontop -->
         <img src="site-files/landing/herov1.png" alt="Hero" />
         <img id="hero-logo" src="site-files/landing/Haus_Of_Eras_Final_Design.png" alt="Logo">
    </div>
    <nav class="menu" style="justify-content: center !important; width: 100%">
        <li class="menu-item big-shoulders-text"><a href="coming-soon.html">Work</a></li>
        <li class="menu-item big-shoulders-text"><a href="coming-soon.html">Studio</a></li>
        <li class="menu-item big-shoulders-text"><a href="coming-soon.html">Services</a></li>
        <li id="contact-btn" class="big-shoulders-text"><a href="#contact-section-title">Contact/Book</a></li>
    </nav>
    <div id="main-container">
        <div id="our-work-section-title">
            <h1 class="big-shoulders-text">OUR WORK</h1>
        </div>
        <div id="our-work-section">
            <div class="our-work big-shoulders-text">
                <img src="site-files/landing/SolosthesiaDeluxeAlbumCover.JPG" alt="Sample-Work-1" />
                <div class="divider"></div>
                <h1>Solosthesia Deluxe Album Cover</h1>
            </div>
            <div class="our-work big-shoulders-text">
                <img src="site-files/landing/Reeno.jpg" alt="Sample-Work-2" />
                <div class="divider"></div>
                <h1>Reeno</h1>
            </div>
            <div class="our-work big-shoulders-text">
                <img src="site-files/landing/Damselden8.7.png" alt="Sample-Work-3" />
                <div class="divider"></div>
                <h1>Damselden8.7</h1>
            </div>
            <div class="our-work big-shoulders-text">
                <img src="site-files/landing/SolosthesiaAlbumCover.jpg" alt="Sample-Work-3" />
                <div class="divider"></div>
                <h1>Solosthesia Album Cover</h1>
            </div>
            <div class="our-work big-shoulders-text">
                <img src="site-files/landing/MarketCrash.jpg" alt="Sample-Work-5" />
                <div class="divider"></div>
                <h1>Market Crash</h1>
            </div>
            <div class="our-work big-shoulders-text">
                <img src="site-files/landing/PraisetheCreativesFire.JPG" alt="Sample-Work-6" />
                <div class="divider"></div>
                <h1>Praise The Creatives - Fire</h1>
            </div>
        </div>
        <div class="big-shoulders-text" id="contact-section-title">
            <h1>CONTACT US</h1>
        </div>
        <div class="contact-section">
            <div class="contact-image">
                <img src="site-files/landing/IzzyDanceClass.jpg" alt="Contact">
            </div>
            <div class="contact-section-field" id="contact-form">
                <form action="https://formspree.io/f/xwlpdywd" method="POST">
                    <input type="hidden" name="_next" value="https://kudirat.github.io/haus_of_eras/thanks.html">
                    <div class="form-row">
                        <input type="text" name="firstName" placeholder="First Name" required>
                        <input type="text" name="lastName" placeholder="Last Name" required>
                    </div>
                    <input type="email" name="email" placeholder="Email" required>
                    <input type="tel" name="phone" placeholder="Phone Number">
                    <select name="service">
                        <option value="">Select a Service</option>
                        <option value="option1">Inquiry</option>
                        <!-- etc -->
                    </select>
                    <textarea name="message" placeholder="Leave a Message"></textarea>
                    <button type="submit">Send</button>
                </form>
            </div>
        </div>
    </div>
</body>

</html>
